name: Refresh results

# Rebuilds the results feed (ESPN results and team logos) and publishes it to the `feed` branch,
# where the website copy at c0rw1n.com/sportstalk loads it when a visitor asks for the latest results.
# Runs twice a day, after every push to main, and on demand from the Actions tab.
on:
  schedule:
    # 06:30 and 18:30 UTC: after North American night games and European afternoon games.
    - cron: "30 6,18 * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Team logos downloaded by earlier runs, so each refresh only fetches new ones
      - uses: actions/cache@v4
        with:
          path: _cache
          key: logos-${{ github.run_id }}
          restore-keys: logos-

      - name: Build the results feed
        run: node src/build.js --site-only --feed _feed

      # The feed branch holds a single commit that is replaced each run, so it never grows
      - name: Publish the feed branch
        working-directory: _feed
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b feed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Results feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" feed

      # GitHub pauses scheduled workflows in public repositories after 60 days with no activity.
      # If nothing has been committed to main for 45 days, add an empty commit to keep the schedule running.
      - name: Keep the schedule active
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the scheduled refresh active"
            git push
          fi
