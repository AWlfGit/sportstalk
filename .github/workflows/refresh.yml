name: Refresh results

# Rebuilds the page with the latest ESPN results and publishes it to GitHub Pages.
# Runs twice a day, after every push to main, and on demand from the Actions tab.
on:
  schedule:
    # 06:30 and 18:30 UTC: after North American night games and European afternoon games.
    - cron: "30 6,18 * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the page with the latest results
        run: node src/build.js --site-only --site _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub pauses scheduled workflows in public repositories after 60 days with no activity.
      # If nothing has been committed for 45 days, add an empty commit to keep the schedule running.
      - name: Keep the schedule active
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the scheduled refresh active"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
